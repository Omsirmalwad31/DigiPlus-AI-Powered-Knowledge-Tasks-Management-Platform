spring:
  application:
    name: knowledge-task-management
  servlet:
    multipart:
      max-file-size: 14MB
      max-request-size: 15MB
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:h2:mem:digiplus;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
digiplus:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
  speechify:
    api-key: ${SPEECHIFY_API_KEY:}
    voice-id: ${SPEECHIFY_VOICE_ID:geffen_32}
  cors:
    allowed-origins: ${DIGIPLUS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
server:
  port: 8081
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"